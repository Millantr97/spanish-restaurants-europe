es:{nav_map:'Restaurantes',nav_guides:'Guías',nav_rankings:'Clasificaciones',nav_recipes:'Recetas',nav_shops:'Tiendas',title:'Tiendas españolas en Europa',subtitle:'Tiendas físicas y supermercados españoles online · 9 países · verificado en webs de las tiendas y Google Maps, 10 sep 2026',

};
let LANG='en', MODE='near', userLoc=null, sortBy='name';
const t=k=>I18N[LANG][k]||k;
const TN=k=>(LANG==='es'?TAGNAMES_ES:TAGNAMES)[k]||k;
const KN=k=>(LANG==='es'?KINDNAMES_ES:KINDNAMES)[k]||k;
const CN=c=>(LANG==='es'?COUNTRIES_ES:COUNTRIES)[c]||c;
const $=id=>document.getElementById(id);
function applyI18n(){
  document.documentElement.lang=LANG;
  document.querySelectorAll('[data-i18n]').forEach(el=>{el.textContent=t(el.dataset.i18n)});
  document.querySelectorAll('[data-i18n-ph]').forEach(el=>{el.placeholder=t(el.dataset.i18nPh)});
  buildCountrySelects(); buildChips(); buildThead(); updateCount(); updateTable();
}
$('lang-en').onclick=()=>{LANG='en';$('lang-en').classList.add('on');$('lang-es').classList.remove('on');applyI18n()};

// ---------- state ----------
let q='', fCountry='', fKinds=new Set(), fTags=new Set(), minRating=0, showAudit=false, delivCountry='GB';
const physical=DATA.shops.filter(s=>s.type==='physical');
const online=DATA.shops.filter(s=>s.type==='online');
const audit=DATA.audit;
// ---------- map ----------
const map=L.map('map',{worldCopyJump:true}).setView([50.5,10],4);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap contributors'}).addTo(map);
const cluster=L.markerClusterGroup({maxClusterRadius:42}).addTo(map);
let markers=[];
function kindColor(k){return k==='wine'?'#6b4fa0':k==='wholesale'?'#e07b39':'#8e1f2f'}
function markerFor(s,unv){
  const col=unv?'#999':kindColor(s.kind);
  const m=L.circleMarker([s.lat,s.lng],{radius:7,color:'#fff',weight:1.5,fillColor:col,fillOpacity:.95});
  m._shop=s; m._unv=unv;
  m.bindPopup(popupHtml(s,unv));
  return m;
}
function popupHtml(s,unv){
  const rat=s.rating?('★ '+s.rating+(s.rcount?' ('+s.rcount+')':'')):'';
  const tags=(s.tags||[]).map(x=>`<span class="tagchip">${TN(x)}</span>`).join(' ');
  let links='';
  if(s.url) links+=`<a href="${s.url}" target="_blank" rel="noopener">${t('website')}</a> · `;
  if(s.maps_url) links+=`<a href="${s.maps_url}" target="_blank" rel="noopener">${t('directions')}</a>`;
  return `<div class="popup"><b>${s.name}</b>${unv?` <span class="badge unv">${t('unverified')}</span>`:''}<br>
  <span class="cat">${KN(s.kind)} · ${s.city}, ${CN(s.country)} ${rat}</span><br>
  <span class="cat">${s.address}</span><br>${tags}<br>${links}</div>`;
}
function passFilters(s){
  if(fCountry && s.country!==fCountry) return false;
  if(fKinds.size && !fKinds.has(s.kind)) return false;
  if(fTags.size && !(s.tags||[]).some(x=>fTags.has(x))) return false;
  if(s.rating!=null && s.rating<minRating) return false;
  if(minRating>0 && s.rating==null) return false;
  if(q){const h=(s.name+' '+s.city+' '+s.address).toLowerCase(); if(!h.includes(q)) return false;}
  return true;
}
function refreshMarkers(){
  cluster.clearLayers(); markers=[];
  physical.filter(passFilters).forEach(s=>{const m=markerFor(s,false);markers.push(m);cluster.addLayer(m)});
  if(showAudit) audit.filter(passFilters).forEach(s=>{const m=markerFor(s,true);markers.push(m);cluster.addLayer(m)});
  updateCount(); updateTable();
}

function buildCountrySelects(){
  const cur=fCountry;
  $('country').innerHTML=`<option value="">${t('anycountry')}</option>`+Object.keys(COUNTRIES).map(c=>`<option value="${c}" ${c===cur?'selected':''}>${CN(c)}</option>`).join('');
  const dc=delivCountry;
  $('delivcountry').innerHTML=Object.keys(COUNTRIES).map(c=>`<option value="${c}" ${c===dc?'selected':''}>${CN(c)}</option>`).join('');
}
function buildChips(){
  $('kindchips').innerHTML=Object.keys(KINDNAMES).map(k=>`<span class="chip ${fKinds.has(k)?'on':''}" data-kind="${k}">${KN(k)}</span>`).join('');
  $('tagchips').innerHTML=Object.keys(TAGNAMES).map(k=>`<span class="chip ${fTags.has(k)?'on':''}" data-tag="${k}">${TN(k)}</span>`).join('');
  document.querySelectorAll('[data-kind]').forEach(el=>el.onclick=()=>{const k=el.dataset.kind;fKinds.has(k)?fKinds.delete(k):fKinds.add(k);el.classList.toggle('on');MODE==='near'?refreshMarkers():updateTable()});
  document.querySelectorAll('[data-tag]').forEach(el=>el.onclick=()=>{const k=el.dataset.tag;fTags.has(k)?fTags.delete(k):fTags.add(k);el.classList.toggle('on');MODE==='near'?refreshMarkers():updateTable()});
}
function buildThead(){
  $('theadrow').innerHTML = MODE==='near'
    ? `<th>${t('th_name')}</th><th>${t('th_city')}</th><th>${t('th_country')}</th><th>${t('th_rating')}</th><th>${t('th_dist')}</th><th>${t('th_kind')}</th>`
    : `<th>${t('th_name')}</th><th>${t('th_delivery')}</th><th>${t('th_tags')}</th><th>${t('th_link')}</th>`;
}
const hav=(a,b,c,d)=>{const R=6371,p=Math.PI/180,dLa=(c-a)*p,dLo=(d-b)*p,x=Math.sin(dLa/2)**2+Math.cos(a*p)*Math.cos(c*p)*Math.sin(dLo/2)**2;return 2*R*Math.asin(Math.sqrt(x))};
function visibleInMap(s){const b=map.getBounds();return b.contains([s.lat,s.lng])}
function updateCount(){
  const n=MODE==='near'?physical.filter(passFilters).length+(showAudit?audit.filter(passFilters).length:0):delivList().length;
  $('count').textContent=n+' '+(MODE==='near'?(LANG==='es'?'tiendas':'shops'):(LANG==='es'?'tiendas online':'online shops'));
}
function delivList(){
  return online.filter(s=>s.delivers_to.includes(delivCountry))
    .filter(s=>!fTags.size || (s.tags||[]).some(x=>fTags.has(x)))
    .filter(s=>{if(!q)return true;return (s.name+' '+(s.delivery_note||'')).toLowerCase().includes(q)})
    .sort((a,b)=>a.name.localeCompare(b.name));
}
function updateTable(){
  const tb=$('tbody');
  if(MODE==='near'){
    buildThead();
    let list=physical.filter(passFilters).filter(visibleInMap);
    let alist=showAudit?audit.filter(passFilters).filter(visibleInMap):[];
    if(userLoc){const d=s=>hav(userLoc.lat,userLoc.lng,s.lat,s.lng);list.sort((a,b)=>d(a)-d(b));alist.sort((a,b)=>d(a)-d(b))}
    else{list.sort((a,b)=>a.name.localeCompare(b.name))}
    const rows=list.concat(alist).slice(0,400).map(s=>{
      const dist=userLoc?(hav(userLoc.lat,userLoc.lng,s.lat,s.lng).toFixed(1)+' km'):'';
      const rat=s.rating?('★ '+s.rating+(s.rcount?` (${s.rcount})`:'')):'';
      const unv=alist.includes(s);
      return `<tr data-uid="${s.uid}"><td>${s.name}${unv?` <span class="badge unv">${t('unverified')}</span>`:''}</td><td>${s.city}</td><td>${CN(s.country)}</td><td>${rat}</td><td>${dist}</td><td>${KN(s.kind)}</td></tr>`;
    }).join('');
    tb.innerHTML=rows||`<tr><td colspan="6" style="color:#999">${LANG==='es'?'Sin resultados en esta zona.':'No results in this area.'}</td></tr>`;
    tb.querySelectorAll('tr[data-uid]').forEach(tr=>tr.onclick=()=>{
      const s=[...physical,...audit].find(x=>x.uid===tr.dataset.uid); if(!s)return;
      map.setView([s.lat,s.lng],Math.max(15,map.getZoom()));
      const m=markers.find(m=>m._shop===s); if(m) cluster.zoomToShowLayer(m,()=>m.openPopup());
    });
  } else {
    buildThead();
    const list=delivList();
    tb.innerHTML=list.map(s=>{
      const tags=(s.tags||[]).map(x=>`<span class="tagchip">${TN(x)}</span>`).join(' ');
      const alc=s.alcohol?`<span class="badge alc">🍷 ${t('alcohol')}</span>`:'';
      return `<tr><td><b>${s.name}</b><br><span class="dnote">${t('delivers')}: ${s.delivers_to.map(CN).join(', ')}</span></td>
      <td class="dnote">${s.delivery_note||''}</td><td>${tags} ${alc}</td>
      <td><a href="${s.url}" target="_blank" rel="noopener">${t('visit')}</a></td></tr>`;
    }).join('')||`<tr><td colspan="4" style="color:#999">${LANG==='es'?'Sin tiendas para este país.':'No shops for this country.'}</td></tr>`;
  }
  updateCount();
}
// ---------- events ----------
$('search').oninput=e=>{q=e.target.value.trim().toLowerCase();MODE==='near'?refreshMarkers():updateTable()};
$('country').onchange=e=>{fCountry=e.target.value;refreshMarkers()};
$('delivcountry').onchange=e=>{delivCountry=e.target.value;updateTable()};
$('minrating').oninput=e=>{minRating=parseFloat(e.target.value);$('rateval').textContent=minRating>0?minRating:t('any');refreshMarkers()};
$('showaudit').onchange=e=>{showAudit=e.target.checked;refreshMarkers()};
$('clear').onclick=()=>{q='';fCountry='';fKinds.clear();fTags.clear();minRating=0;showAudit=false;$('search').value='';$('minrating').value=0;$('rateval').textContent=t('any');$('showaudit').checked=false;buildChips();buildCountrySelects();refreshMarkers()};
$('legend-toggle').onclick=()=>{const b=$('legend-body');b.style.display=b.style.display==='none'?'block':'none'};
function setMode(m){
  MODE=m;
  document.body.classList.toggle('mode-deliv',m==='deliv');
  $('tab-near').classList.toggle('on',m==='near');$('tab-deliv').classList.toggle('on',m==='deliv');
  $('nearcontrols').style.display=m==='near'?'block':'none';
  $('delivwrap').style.display=m==='deliv'?'block':'none';
  if(m==='near'){map.invalidateSize();refreshMarkers()}else{updateTable()}
}
$('tab-near').onclick=()=>setMode('near');
$('tab-deliv').onclick=()=>setMode('deliv');
map.on('moveend',()=>{if(MODE==='near')updateTable()});
const geoBtn=$('geo'),geoStatus=$('geostatus');
geoBtn.onclick=()=>{
  if(userLoc){map.flyTo([userLoc.lat,userLoc.lng],12,{duration:0.8});return}
  if(!navigator.geolocation){geoStatus.textContent=LANG==='es'?'Geolocalización no soportada.':'Geolocation not supported.';geoStatus.className='geostatus err';return}
  geoBtn.disabled=true;geoStatus.textContent=LANG==='es'?'Localizando…':'Locating…';
  navigator.geolocation.getCurrentPosition(pos=>{
    userLoc={lat:pos.coords.latitude,lng:pos.coords.longitude};
    L.circleMarker([userLoc.lat,userLoc.lng],{radius:8,color:'#fff',weight:2,fillColor:'#1a73e8',fillOpacity:1}).addTo(map);
    geoBtn.disabled=false;geoBtn.classList.add('on');
    geoStatus.textContent=LANG==='es'?'Ubicación encontrada: la tabla muestra distancias.':'Location found - table now shows distances.';
    map.flyTo([userLoc.lat,userLoc.lng],12,{duration:0.8});updateTable();
  },err=>{geoBtn.disabled=false;geoStatus.textContent=LANG==='es'?'No se pudo obtener tu ubicación.':'Could not get your location.';geoStatus.className='geostatus err'},
  {timeout:10000,maximumAge:300000});
};
buildCountrySelects();buildChips();buildThead();applyI18n();refreshMarkers();
map.setView([50.5,10],4);
</script>
</body>
</html>
